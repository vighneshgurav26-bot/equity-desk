name: equity-desk

on:
  schedule:
    - cron: "*/15 4-9 * * 1-5"
    - cron: "40 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: equity-desk
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install requests PyYAML
      - name: Run one cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: python -m desk.run
      - name: Commit state
        run: |
          git config user.name "equity-desk"
          git config user.email "desk@users.noreply.github.com"
          git add -A state docs || true
          git diff --staged --quiet || git commit -m "cycle $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash || true
          git push || true
